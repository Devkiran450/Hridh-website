<script>

const lastOrder = JSON.parse(localStorage.getItem("lastOrder"));

if(lastOrder){

fetch("https://hridh-backend.onrender.com/api/products/sold-products")

.then(res=>res.json())

.then(data=>{

localStorage.setItem("soldProducts", JSON.stringify(data));

});

}

</script>
