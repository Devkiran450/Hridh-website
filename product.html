<script>

async function loadSoldProducts(){

try{

const res = await fetch("https://hridh-backend.onrender.com/api/products/sold-products");

return await res.json();

}catch{

return [];

}

}

(async function(){

updateCartCount();

const params = new URLSearchParams(window.location.search);

const id = Number(params.get("id"));

const soldIds = await loadSoldProducts();

const product = products.find(p => p.id === id);

if(!product){

document.querySelector(".pdp").innerHTML = "<p>Product not found</p>";

return;

}

document.title = product.name + " – One of One Artwork | HRIDH";

if(soldIds.includes(product.id)) product.sold = true;

/* TEXT */

document.getElementById("product-name").innerText = product.name;

document.getElementById("product-story").innerText = product.story;

document.getElementById("product-desc").innerText = product.description;

document.getElementById("product-artid").innerText = product.productId || product.code;

document.getElementById("product-year").innerText = product.year || "2026";

document.getElementById("product-edition").innerText = product.edition || "1 of 1";

/* PRICE */

document.getElementById("product-price").innerText = "₹"+product.price;

document.getElementById("product-mrp").innerText = "₹"+product.originalPrice;

if(product.originalPrice){

const discount = Math.round(100-(product.price/product.originalPrice)*100);

document.getElementById("product-discount").innerText = "-"+discount+"%";

}

/* IMAGE SLIDER */

const track = document.getElementById("image-track");

const thumbs = document.getElementById("thumbs");

let currentIndex = 0;

product.images.forEach((img,index)=>{

const image = document.createElement("img");

image.src = img;

track.appendChild(image);

const thumb = document.createElement("img");

thumb.src = img;

if(index===0) thumb.classList.add("active");

thumb.onclick = ()=>goToSlide(index);

thumbs.appendChild(thumb);

});

function goToSlide(index){

currentIndex=index;

track.style.transform=`translateX(-${index*100}%)`;

document.querySelectorAll(".pdp-thumbs img").forEach(t=>t.classList.remove("active"));

document.querySelectorAll(".pdp-thumbs img")[index].classList.add("active");

}

document.getElementById("next-img").onclick=()=>{

let i=currentIndex+1;

if(i>=product.images.length) i=0;

goToSlide(i);

};

document.getElementById("prev-img").onclick=()=>{

let i=currentIndex-1;

if(i<0) i=product.images.length-1;

goToSlide(i);

};

/* SWIPE */

let startX=0;

track.addEventListener("touchstart",(e)=>{

startX=e.touches[0].clientX;

});

track.addEventListener("touchend",(e)=>{

const diff=startX-e.changedTouches[0].clientX;

if(diff>40){

let i=currentIndex+1;

if(i>=product.images.length) i=0;

goToSlide(i);

}

if(diff<-40){

let i=currentIndex-1;

if(i<0) i=product.images.length-1;

goToSlide(i);

}

});

/* CART UI */

function renderCartAction(){

const cart=getCart();

const exists=cart.find(p=>p.id===product.id);

const container=document.getElementById("cart-action");

if(product.sold){

container.innerHTML=`<button class="add-to-cart-btn" disabled>SOLD</button>`;

return;

}

if(!exists){

container.innerHTML=`

<button class="add-to-cart-btn" onclick="addProductToCart()">

Add to Cart

</button>

`;

}else{

container.innerHTML = `

<button class="qty-mode">

<span class="qty-btn" onclick="removeFromCart()">−</span>

<span class="quantity">1</span>

<span class="qty-btn" onclick="showToast('Only one piece available')">+</span>

</button>

`;

}

}

window.addProductToCart=function(){

addToCart(product);

updateCartCount();

renderCartAction();

showToast("Added to cart");

};

window.removeFromCart=function(){

let cart=getCart();

cart=cart.filter(p=>p.id!==product.id);

saveCart(cart);

updateCartCount();

renderCartAction();

showToast("Removed from cart");

};

renderCartAction();

})();

</script>
